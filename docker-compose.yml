services:

  db:
    image: postgres:17
    container_name: predictive-maintenance-db
    environment:
      POSTGRES_DB: predictive_maintenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predictive_maintenance"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: predictive-maintenance-api-compose
    ports:
      - "8001:8000"
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: predictive_maintenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
    container_name: predictive-maintenance-dashboard
    command: streamlit run dashboard.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    volumes:
      - ./models:/app/models
    depends_on:
      - api

  monitoring:
    build:
      context: .
    container_name: predictive-maintenance-monitoring
    command: python run_monitoring.py
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: predictive_maintenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./models:/app/models
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: